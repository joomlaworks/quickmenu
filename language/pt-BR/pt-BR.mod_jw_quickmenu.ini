MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>Um menu rápido para a administração do Joomla para restaurar a praticidade da experiência do usuário.</p><p>Atribua a posição de administração <b>status</b> ao módulo e publique-o.</p><p>O módulo respeitará integralmente as permissões de acesso atribuídas aos grupos de usuários.</p><p>Aproveite!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> é um módulo <a target='_blank' href='https://www.joomla.org'>Joomla</a> desenvolvido por <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a>, lançado sob a <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>Licença Pública Geral GNU</a>.</p><p>Copyright &copy; 2006 - 2026 JoomlaWorks Ltd. Todos os direitos reservados.</p><p><i>(Última atualização: 20 de novembro de 2026 - Versão 2.0)</i></p></div>"


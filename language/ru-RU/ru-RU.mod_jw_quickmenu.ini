MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>Быстрое меню для панели администратора Joomla, возвращающее удобство работы.</p><p>Назначьте модулю позицию панели управления <b>status</b> и опубликуйте его.</p><p>Модуль полностью учитывает права доступа, назначенные группам пользователей.</p><p>Приятной работы!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> — модуль для <a target='_blank' href='https://www.joomla.org'>Joomla</a>, разработанный <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> и распространяемый под лицензией <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU General Public License</a>.</p><p>Copyright &copy; 2006 - 2026 JoomlaWorks Ltd. Все права защищены.</p><p><i>(Последнее обновление: 20 ноября 2026 г. - Версия 2.0)</i></p></div>"


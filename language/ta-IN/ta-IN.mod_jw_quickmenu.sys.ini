MOD_JW_QUICKMENU_XML_DESC="<p>Joomla நிர்வாகப் பகுதியில் எளிமையான பயனர் அனுபவத்தை மீண்டும் கொண்டுவரும் விரைவு மெனு.</p><p><a href='index.php?option=com_modules&view=modules&client_id=1&filter[module]=mod_jw_quickmenu'>அமைப்பு > நிர்வாகி தொகுதிகள்</a> கீழ் தொகுதியைக் கண்டறிந்து, 'status' இடத்திற்கு ஒதுக்கி வெளியிடவும்.</p><p>மகிழுங்கள்!</p>"

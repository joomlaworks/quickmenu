MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>Joomla நிர்வாகப் பகுதியில் எளிமையான பயனர் அனுபவத்தை மீண்டும் கொண்டுவரும் விரைவு மெனு.</p><p>தொகுதிக்கு <b>status</b> என்ற பின்புல இடத்தை ஒதுக்கி வெளியிடவும்.</p><p>பயனர் குழுக்களுக்கு ஒதுக்கப்பட்ட பின்புல அணுகல் அனுமதிகளை இந்தத் தொகுதி முழுமையாகப் பின்பற்றும்.</p><p>மகிழுங்கள்!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> என்பது <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> உருவாக்கிய <a target='_blank' href='https://www.joomla.org'>Joomla</a> தொகுதியாகும், இது <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU பொது உரிமத்தின்</a> கீழ் வெளியிடப்பட்டுள்ளது.</p><p>பதிப்புரிமை &copy; 2006 - 2026 JoomlaWorks Ltd. அனைத்து உரிமைகளும் பாதுகாக்கப்பட்டவை.</p><p><i>(கடைசி புதுப்பிப்பு: நவம்பர் 20, 2026 - பதிப்பு 2.0)</i></p></div>"


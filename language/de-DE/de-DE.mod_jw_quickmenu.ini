MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>Ein Schnellmenü für das Joomla-Backend, um wieder Klarheit in die Benutzerführung zu bringen.</p><p>Weisen Sie dem Modul die Backend-Position <b>status</b> zu und veröffentlichen Sie es.</p><p>Das Modul berücksichtigt vollständig die für Benutzergruppen zugewiesenen Backend-Zugriffsrechte.</p><p>Viel Spaß!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> ist ein <a target='_blank' href='https://www.joomla.org'>Joomla</a>-Modul, entwickelt von <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> und veröffentlicht unter der <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU General Public License</a>.</p><p>Copyright &copy; 2006 - 2026 JoomlaWorks Ltd. Alle Rechte vorbehalten.</p><p><i>(Letzte Aktualisierung: 20. November 2026 - Version 2.0)</i></p></div>"


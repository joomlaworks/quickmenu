MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>সহজ ও দ্রুত ব্যবহারযোগ্য অভিজ্ঞতার জন্য Joomla অ্যাডমিন/ব্যাকএন্ডের একটি কুইক মেনু।</p><p>মডিউলটিতে ব্যাকএন্ড পজিশন <b>status</b> নির্ধারণ করুন এবং প্রকাশ করুন।</p><p>মডিউলটি ব্যবহারকারী গোষ্ঠীর জন্য নির্ধারিত ব্যাকএন্ড অ্যাক্সেস অনুমতি সম্পূর্ণভাবে অনুসরণ করবে।</p><p>উপভোগ করুন!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> হলো <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> দ্বারা তৈরি একটি <a target='_blank' href='https://www.joomla.org'>Joomla</a> মডিউল, যা <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU জেনারেল পাবলিক লাইসেন্স</a>-এর অধীনে প্রকাশিত।</p><p>কপিরাইট &copy; 2006 - 2026 JoomlaWorks Ltd. সর্বস্বত্ব সংরক্ষিত।</p><p><i>(সর্বশেষ আপডেট: ২০ নভেম্বর, ২০২৬ - সংস্করণ ২.০)</i></p></div>"


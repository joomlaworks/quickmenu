MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>మెరుగైన వినియోగదారు అనుభవాన్ని తిరిగి తీసుకురావడానికి Joomla అడ్మిన్/బ్యాకెండ్ కోసం ఒక క్విక్ మెనూ.</p><p>మాడ్యూల్‌కు బ్యాకెండ్ స్థానం <b>status</b> కేటాయించి ప్రచురించండి.</p><p>వినియోగదారు సమూహాలకు కేటాయించిన బ్యాకెండ్ యాక్సెస్ అనుమతులను ఈ మాడ్యూల్ పూర్తిగా గౌరవిస్తుంది.</p><p>ఆనందించండి!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> అనేది <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> రూపొందించిన <a target='_blank' href='https://www.joomla.org'>Joomla</a> మాడ్యూల్, ఇది <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU జనరల్ పబ్లిక్ లైసెన్స్</a> క్రింద విడుదల చేయబడింది.</p><p>కాపీరైట్ &copy; 2006 - 2026 JoomlaWorks Ltd. సర్వ హక్కులు ప్రత్యేకించబడినవి.</p><p><i>(చివరి అప్‌డేట్: నవంబర్ 20, 2026 - వెర్షన్ 2.0)</i></p></div>"


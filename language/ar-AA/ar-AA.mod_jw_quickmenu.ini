MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>قائمة سريعة للوحة تحكم Joomla لاستعادة سلاسة تجربة المستخدم.</p><p>عيّن الموضع الإداري <b>status</b> للوحدة النمطية ثم انشرها.</p><p>ستحترم الوحدة النمطية بالكامل أذونات الوصول المخصصة لمجموعات المستخدمين.</p><p>استمتع!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> هي وحدة نمطية لنظام <a target='_blank' href='https://www.joomla.org'>Joomla</a> من تطوير <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a>، صادرة بموجب <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>رخصة جنو العمومية</a>.</p><p>جميع الحقوق محفوظة &copy; 2006 - 2026 JoomlaWorks Ltd.</p><p><i>(آخر تحديث: 20 نوفمبر 2026 - الإصدار 2.0)</i></p></div>"


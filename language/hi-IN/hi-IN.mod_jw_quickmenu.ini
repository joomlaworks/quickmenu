MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>बेहतर यूज़र अनुभव के लिए Joomla एडमिन/बैकएंड हेतु एक त्वरित मेनू।</p><p>मॉड्यूल को बैकएंड पोजीशन <b>status</b> असाइन करें और इसे प्रकाशित करें।</p><p>यह मॉड्यूल उपयोगकर्ता समूहों के लिए निर्धारित बैकएंड एक्सेस अनुमतियों का पूरी तरह पालन करेगा।</p><p>आनंद लें!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> एक <a target='_blank' href='https://www.joomla.org'>Joomla</a> मॉड्यूल है जिसे <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> द्वारा विकसित किया गया है और <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU जनरल पब्लिक लाइसेंस</a> के तहत जारी किया गया है।</p><p>कॉपीराइट &copy; 2006 - 2026 JoomlaWorks Ltd. सर्वाधिकार सुरक्षित।</p><p><i>(अंतिम अपडेट: 20 नवंबर 2026 - संस्करण 2.0)</i></p></div>"


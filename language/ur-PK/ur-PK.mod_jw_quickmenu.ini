MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>Joomla ایڈمن/بیک اینڈ کے لیے ایک فوری مینو تاکہ بہتر صارف تجربہ بحال ہو سکے۔</p><p>ماڈیول کو بیک اینڈ پوزیشن <b>status</b> تفویض کریں اور اسے شائع کریں۔</p><p>یہ ماڈیول صارف گروپس کے لیے مقرر کردہ بیک اینڈ رسائی کی اجازتوں کا مکمل احترام کرے گا۔</p><p>لطف اٹھائیں!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> ایک <a target='_blank' href='https://www.joomla.org'>Joomla</a> ماڈیول ہے جسے <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> نے تیار کیا ہے اور <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU جنرل پبلک لائسنس</a> کے تحت جاری کیا گیا ہے۔</p><p>کاپی رائٹ &copy; 2006 - 2026 JoomlaWorks Ltd. جملہ حقوق محفوظ ہیں۔</p><p><i>(آخری اپ ڈیٹ: 20 نومبر 2026 - ورژن 2.0)</i></p></div>"


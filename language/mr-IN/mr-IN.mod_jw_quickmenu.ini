MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>सुसह्य वापरकर्ता अनुभव परत आणण्यासाठी Joomla अ‍ॅडमिन/बॅकएंडसाठी एक जलद मेनू.</p><p>मॉड्यूलला बॅकएंड पोझिशन <b>status</b> नेमा आणि प्रकाशित करा.</p><p>हे मॉड्यूल वापरकर्ता गटांसाठी नेमलेल्या बॅकएंड प्रवेश परवानग्यांचे पूर्णपणे पालन करेल.</p><p>आनंद घ्या!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> हे <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a> ने विकसित केलेले <a target='_blank' href='https://www.joomla.org'>Joomla</a> मॉड्यूल आहे, जे <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>GNU जनरल पब्लिक लायसन्स</a> अंतर्गत प्रकाशित केले आहे.</p><p>कॉपीराइट &copy; 2006 - 2026 JoomlaWorks Ltd. सर्व हक्क राखीव.</p><p><i>(शेवटचे अद्यतन: 20 नोव्हेंबर 2026 - आवृत्ती 2.0)</i></p></div>"


MOD_JW_QUICKMENU_XML_DESC="<p><picture><source media='(prefers-color-scheme: dark)' srcset='../media/mod_jw_quickmenu/logo/quickmenu-logo-dark.svg'><img src='../media/mod_jw_quickmenu/logo/quickmenu-logo-light.svg' alt='Quick Menu' style='height:48px;width:auto;' /></picture></p><p>Menu nhanh cho trang quản trị Joomla giúp khôi phục trải nghiệm người dùng gọn gàng.</p><p>Gán vị trí quản trị <b>status</b> cho mô-đun và xuất bản nó.</p><p>Mô-đun sẽ tuân thủ đầy đủ các quyền truy cập quản trị được gán cho từng nhóm người dùng.</p><p>Chúc bạn sử dụng hiệu quả!</p><div style='margin-top:30px;padding:15px 0;border-top:1px solid #ccc;'><p><b>Quick Menu</b> là một mô-đun <a target='_blank' href='https://www.joomla.org'>Joomla</a> được phát triển bởi <a target='_blank' href='https://www.joomlaworks.net'>JoomlaWorks</a>, phát hành theo <a target='_blank' title='GNU General Public License' href='https://www.gnu.org/copyleft/gpl.html'>Giấy phép Công cộng GNU</a>.</p><p>Bản quyền &copy; 2006 - 2026 JoomlaWorks Ltd. Bảo lưu mọi quyền.</p><p><i>(Cập nhật lần cuối: 20 tháng 11 năm 2026 - Phiên bản 2.0)</i></p></div>"

